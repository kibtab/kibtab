# air configuration for Kibtab development.
# Run `air` in the repository root to rebuild and rerun cmd/kibtab on save.
root = "."
testdata_dir = "testdata"
tmp_dir = "bin"

[build]
  args_bin = []
  # entrypoint replaces the deprecated bin key. air runs the binary that
  # cmd builds, and a bare run prints the banner and the health check.
  entrypoint = ["./bin/kibtab"]
  cmd = "CGO_ENABLED=0 go build -o ./bin/kibtab ./cmd/kibtab"
  delay = 1000
  exclude_dir = ["assets", "bin", "client", "docs", "skills", "testdata", "vendor"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = true
  follow_symlink = true
  full_bin = ""
  include_dir = []
  include_ext = ["go", "toml", "yaml", "sql"]
  kill_delay = "0s"
  log = "build-errors.log"
  max_build_errors = 10
  send_interrupt = false
  stop_on_root = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false