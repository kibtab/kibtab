# Continuous integration for Kibtab.
#
# The workflow builds, vets, tests, and checks the coverage of the Go
# code. It runs no documentation check; Read the Docs builds the
# documentation instead (see .readthedocs.yaml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  client-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: client/excel/pnpm-lock.yaml

      - name: Install client deps
        run: |
          cd client/excel
          pnpm install --frozen-lockfile

      - name: Build client
        run: |
          cd client/excel
          pnpm build

      - name: Fail when the client build is missing
        run: |
          if [ ! -f client/excel/dist/taskpane.js ]; then
            echo "client/excel/dist/taskpane.js is missing" >&2
            exit 1
          fi

      - name: Zip the client output
        run: |
          cd client/excel && zip -r ../../kibtab-taskpane.zip dist manifest.xml

      - name: Fail when the client zip is missing
        run: |
          if [ ! -f kibtab-taskpane.zip ]; then
            echo "kibtab-taskpane.zip is missing" >&2
            exit 1
          fi

  build-vet-test:
    runs-on: ubuntu-latest
    env:
      # Every step of the job runs without a C compiler.
      CGO_ENABLED: "0"
      # The integration tests need a real PostgreSQL. Without this value
      # they skip, and a skipped test never fails the build.
      KIBTAB_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # The job waits until the database answers before the first step.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          # No go.sum exists yet. Turn the cache on when the module lands.
          cache: false
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Coverage
        run: make cover-verify
      - name: Fail when the core imports a driver
        run: |
          if grep -Rn "internal/adapters" internal/core/; then
            echo "internal/core/ must not import an adapter" >&2
            exit 1
          fi
      - name: Fail when the core names an engine or a client
        run: |
          if grep -En "\b(postgres|duckdb|excel|sheets|local|http)\b" internal/core/; then
            echo "internal/core/ must not name a database engine or a spreadsheet client" >&2
            exit 1
          fi
